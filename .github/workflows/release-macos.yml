name: Publicar WorkBreak para macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente (vX.Y.Z). Vacío: preparar la caché y ejecutar pruebas'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/release-macos.yml
      - requirements-build-mac.lock
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validar VERSION y tag antes de compilar
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.js --check-tag "$RELEASE_TAG"
      - name: Probar publicación con repositorios temporales
        # Corre aunque falle la validación del tag para ver todos los errores en una sola ejecución.
        if: ${{ !cancelled() }}
        run: node --test tests/release.test.js
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Restaurar entorno Python
        id: deps
        uses: actions/cache@v6
        with:
          path: .venv-ci
          key: venv-ci-v1-${{ matrix.runner }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-build-mac.lock') }}
      - name: Instalar dependencias de compilación
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements-build-mac.lock
      - name: Pruebas sin automatización real
        run: .venv-ci/bin/python -m unittest discover -s tests
  build:
    if: github.ref_type == 'tag' || inputs.tag != ''
    # Compila en paralelo con validate y test: un fallo en uno no oculta los errores de los demás.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Restaurar entorno Python
        id: deps
        uses: actions/cache@v6
        with:
          path: .venv-ci
          key: venv-ci-v1-${{ matrix.runner }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-build-mac.lock') }}
      - name: Instalar dependencias de compilación
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements-build-mac.lock
      - name: Importar certificados Developer ID
        env:
          CERTIFICATE_BASE64: ${{ secrets.WORKBREAK_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WORKBREAK_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::Faltan los certificados Developer ID; no se publicará una firma provisional."
            exit 1
          fi
          umask 077
          certificate="$RUNNER_TEMP/workbreak-signing.p12"
          keychain="$RUNNER_TEMP/workbreak-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$certificate"
      - name: Crear instaladores
        env:
          WORKBREAK_CODESIGN_IDENTITY: ${{ vars.WORKBREAK_CODESIGN_IDENTITY }}
          WORKBREAK_INSTALLER_IDENTITY: ${{ vars.WORKBREAK_INSTALLER_IDENTITY }}
          WORKBREAK_TEAM_ID: ${{ vars.WORKBREAK_TEAM_ID }}
        run: .venv-ci/bin/python scripts/build_macos.py --no-migrate
      - name: Eliminar certificados del runner
        if: ${{ always() }}
        run: |
          keychain="$RUNNER_TEMP/workbreak-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/workbreak-signing.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          overwrite: true
  release:
    # Solo publica si el tag es válido, todas las pruebas pasan y ambas arquitecturas compilaron.
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publicar Release del tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = "false" ]; then
            echo "La Release ya está publicada; sus archivos no se reemplazan."
            exit 0
          fi
          for arch in arm64 x86_64; do
            cp "artifacts/WorkBreak-${RELEASE_TAG#v}-macos-${arch}.dmg" "artifacts/WorkBreak-macos-${arch}.dmg"
          done
          notes="$RUNNER_TEMP/workbreak-release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$notes"
          if [ "$existing" = "true" ]; then
            gh release upload "$RELEASE_TAG" artifacts/*.dmg --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.dmg --draft --verify-tag --title "WorkBreak $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release edit "$RELEASE_TAG" --title "WorkBreak $RELEASE_TAG" --notes-file "$notes" --draft=false
